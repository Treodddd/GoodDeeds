const tile=(title,desc,n,emoji)=>`<div class="tile">${n?`<div class="num">${n}</div>`:''}${emoji?`<div class="emoji">${emoji}</div>`:''}<b>${title}</b><p>${desc}</p></div>`;
const grid=(a,cls='')=>`<div class="grid ${cls}">${a.join('')}</div>`;
const img=(i)=>`<div class="illustration"><img src="${shots[i]}" alt="Скріншот поточного інтерфейсу GoodDeeds"></div>`;
function body(kind){switch(kind){
case 'cover':return `<img class="biglogo" src="${logo}" alt="Оригінальний логотип GoodDeeds: жовте серце та чорний напис"><div class="pill">Добрі справи починаються поруч</div><p class="lead" style="margin-top:28px">Вебплатформа, що об’єднує волонтерів та організаторів добрих справ</p><div class="footer-note">Команда №3 · Можливості платформи та напрями розвитку</div>`;
case 'problem':return `<div class="goldblock"><p>Інформація про волонтерські можливості розпорошена між соціальними мережами, чатами й окремими оголошеннями.</p></div><div style="height:24px"></div>${grid([tile('Складно знайти','Потрібно переглядати багато джерел, щоб знайти відповідну акцію.','01'),tile('Складно порівняти','Не завжди одразу зрозумілі місце, час і формат участі.','02'),tile('Складно долучитися','Незрозуміло, з ким зв’язатися і що робити далі.','03')],'three')}`;

const host=document.getElementById('slides');host.innerHTML=items.map((s,i)=>`<section class="slide ${(s[4]||s[3])==='cover'?'cover':''} ${(s[4]||s[3])==='end'?'end':''}" id="s${i}" aria-label="Слайд ${i+1}"><div class="eyebrow">${s[0]}</div>${(s[4]||s[3])==='cover'?'':`<h2>${s[1]}</h2><p class="lead">${s[2]}</p>`}${body(s[4]||s[3])}</section>`).join('');let current=0;const sections=[...document.querySelectorAll('.slide')];function show(i){current=Math.min(sections.length-1,Math.max(0,i));sections.forEach((x,n)=>{x.classList.toggle('active',n===current);if(n===current)x.scrollTop=0});document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+sections.length;document.getElementById('bar').style.width=((current+1)/sections.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===sections.length-1;location.hash=''+(current+1)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}});window.addEventListener('hashchange',()=>{let n=parseInt(location.hash.slice(1));if(Number.isInteger(n)&&n>0&&n<=sections.length&&n!==current+1)show(n-1)});let n=parseInt(location.hash.slice(1));show(Number.isInteger(n)?n-1:0);
</script></body></html>
